[platformio]
src_dir = ../../driver/src

[env:native]
platform = platformio/native@1.2.1
test_framework = unity
test_build_src = yes
build_src_filter = +<*.cpp> -<*_stm32.cpp>
lib_deps = throwtheswitch/Unity@2.6.1
build_flags =
    -I$PROJECT_DIR/../../driver/inc
    -Wall
    -g
    -fsanitize=address,undefined
    -fno-sanitize-recover=all
