name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PLATFORMIO_VERSION: 6.1.19
  CLANG_FORMAT_VERSION: 23.1.3

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: pipx run --spec "clang-format==$CLANG_FORMAT_VERSION" clang-format --dry-run --Werror $(git ls-files '*.c' '*.cpp' '*.h' '*.hpp')

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.platformio
          key: pio-stm32-${{ hashFiles('**/platformio.ini') }}
      - run: pip install "platformio==$PLATFORMIO_VERSION"
      - run: pio run -d examples/0-base-firmware
      - run: pio test -d tests/functional --without-uploading --without-testing

  native-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.platformio
          key: pio-native-${{ hashFiles('tests/native/platformio.ini') }}
      - run: pip install "platformio==$PLATFORMIO_VERSION"
      - run: pio test -d tests/native

  tool-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python3 -m unittest discover -s tests/tools -v
